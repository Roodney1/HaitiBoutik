<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f8f5">
<title>Connexion administration — HaitiBoutik</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#f5f8f5;color:#101713;font:15px system-ui,sans-serif}
.card{width:min(440px,100%);padding:28px;background:#fff;border:1px solid #d9e4dc;border-radius:18px;box-shadow:0 8px 28px rgba(15,40,22,.07)}
.brand{font-size:23px;font-weight:850;color:#101713;text-decoration:none}.brand span{color:#16834b}
h1{font-size:24px;margin:25px 0 8px}p{color:#59665d;line-height:1.55}
label{display:block;margin:17px 0 7px;font-weight:650}
input{width:100%;padding:13px;border:1px solid #cbd8ce;border-radius:9px;background:#fff;color:#101713;font:inherit}
button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:9px;background:#16834b;color:white;font-weight:800;font-size:15px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.status{min-height:24px;color:#9b3b27;font-size:13px;white-space:pre-line}
.note{padding-top:14px;border-top:1px solid #e3ebe5;font-size:12px}
a.back{color:#126b3b}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-client.js"></script>
</head>
<body>
<main class="card">
<a href="index.html" class="brand">Haiti<span>Boutik</span></a>
<h1>Connexion administrateur</h1>
<p>Accès réservé à l’équipe qui administre la boutique officielle HaitiBoutik.</p>
<form id="loginForm">
<label for="email">Adresse e-mail</label>
<input id="email" type="email" required autocomplete="username" placeholder="vous@exemple.com">
<label for="password">Mot de passe</label>
<input id="password" type="password" required autocomplete="current-password" placeholder="Votre mot de passe">
<button id="submit" type="submit">Se connecter</button>
</form>
<p id="status" class="status" role="status" aria-live="polite"></p>
<p class="note">La création de comptes marchands est désactivée : HaitiBoutik utilise une seule boutique officielle. Ne partagez jamais votre mot de passe, PIN ou code OTP.</p>
<a class="back" href="index.html">← Retour à l’accueil</a>
</main>
<script>
const form=document.getElementById('loginForm');
const button=document.getElementById('submit');
const status=document.getElementById('status');
const client=window.haitiBoutikSupabase;
form.addEventListener('submit',async event=>{
 event.preventDefault();
 status.textContent='';
 if(!client){status.textContent='Le service de connexion est indisponible. Vérifiez votre connexion Internet puis réessayez.';return;}
 button.disabled=true;button.textContent='Connexion…';
 try{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const {data,error}=await client.auth.signInWithPassword({email,password});
  if(error)throw error;
  if(data.user?.app_metadata?.role!=='admin'){
   await client.auth.signOut();
   throw new Error('Ce compte ne possède pas les droits administrateur HaitiBoutik.');
  }
  location.replace('admin.html');
 }catch(error){status.textContent=error.message||'Connexion impossible. Réessayez.';}
 finally{button.disabled=false;button.textContent='Se connecter';}
});
(async()=>{
 if(!client)return;
 const {data,error}=await client.auth.getSession();
 if(!error&&data.session){
  if(data.session.user?.app_metadata?.role==='admin')location.replace('admin.html');
  else status.textContent='Ce compte ne possède pas les droits administrateur.';
 }
})();
</script>
</body>
</html>
