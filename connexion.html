<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Connexion — HaitiBoutik</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101010;color:#fff;font:15px system-ui;padding:18px}.card{width:min(440px,100%);background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:26px}.brand{font-size:23px;font-weight:850}.brand span{color:#ff8a35}p{color:#aaa;line-height:1.5}label{display:block;margin:16px 0 6px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#111;color:white}button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:9px;background:#ff8a35;font-weight:800;cursor:pointer}.switch{color:#ffad8e;background:none;border:0;padding:0;margin:8px 0;text-decoration:underline}.warn{font-size:12px;color:#ffc28e;border-top:1px solid #333;padding-top:14px}.status{font-size:13px;min-height:20px;color:#ffc28e;white-space:pre-line}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-client.js"></script></head><body><main class="card"><a href="index.html" class="brand" style="color:white;text-decoration:none">Haiti<span>Boutik</span></a><h1 id="title">Connexion marchand</h1><p id="intro">Accédez à votre espace pour gérer votre boutique.</p>
<form id="form"><div id="nameWrap" hidden><label for="fullname">Nom complet</label><input id="fullname" autocomplete="name" placeholder="Votre nom complet"><label for="phone">Téléphone / WhatsApp</label><input id="phone" autocomplete="tel" placeholder="+509 ..."></div><label for="email">Adresse e-mail</label><input id="email" type="email" required autocomplete="email" placeholder="vous@exemple.com"><label for="password">Mot de passe</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="8 caractères minimum"><button id="submit" type="submit">Se connecter</button></form>
<p id="toggleText" style="font-size:13px">Vous n’avez pas encore de compte ? <button class="switch" id="toggle" type="button">Créer un compte</button></p><p class="status" id="status" role="status"></p><p class="warn">Votre mot de passe est transmis directement à Supabase Auth via une connexion sécurisée. Ne partagez jamais votre mot de passe, PIN ou code OTP.</p></main>
<script>
const $=id=>document.getElementById(id);let signup=false;const client=window.haitiBoutikSupabase;const params=new URLSearchParams(location.search);const next=params.get('next')||'espace-marchand.html';const safeNext=/^(creer-boutique|espace-marchand|ma-boutique|fournisseurs|admin)\.html$/.test(next)?next:'espace-marchand.html';function destination(user){const isAdmin=user?.app_metadata?.role==='admin';return isAdmin?'admin.html':(safeNext==='admin.html'?'espace-marchand.html':safeNext);}
function mode(){signup=!signup;$('nameWrap').hidden=!signup;$('title').textContent=signup?'Créer mon compte':'Connexion marchand';$('intro').textContent=signup?'Créez votre compte pour ouvrir votre boutique HaitiBoutik.':'Accédez à votre espace pour gérer votre boutique.';$('submit').textContent=signup?'Créer mon compte':'Se connecter';$('toggleText').firstChild.textContent=signup?'Vous avez déjà un compte ? ':'Vous n’avez pas encore de compte ? ';$('toggle').textContent=signup?'Se connecter':'Créer un compte';$('password').autocomplete=signup?'new-password':'current-password';$('status').textContent='';}
$('toggle').onclick=mode;
$('form').addEventListener('submit',async e=>{e.preventDefault();$('status').textContent='';if(!client){$('status').textContent='Le service de connexion ne se charge pas. Vérifiez votre connexion Internet puis réessayez.';return;}$('submit').disabled=true;$('submit').textContent='Veuillez patienter…';try{const email=$('email').value.trim(),password=$('password').value;if(signup){const full_name=$('fullname').value.trim(),phone=$('phone').value.trim();if(!full_name||!phone)throw new Error('Renseignez votre nom complet et votre téléphone.');const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name,phone},emailRedirectTo:window.location.origin+window.location.pathname.replace(/[^/]*$/,'connexion.html')+'?next='+encodeURIComponent(safeNext)}});if(error)throw error;if(data.session){location.href=safeNext;}else{$('status').textContent='Compte créé. Consultez votre e-mail pour confirmer votre adresse, puis connectez-vous.';}}else{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;location.href=destination(data.user);}}catch(err){$('status').textContent=err.message||'Une erreur est survenue. Réessayez.';}finally{$('submit').disabled=false;$('submit').textContent=signup?'Créer mon compte':'Se connecter';}});
(async()=>{if(client){const {data}=await client.auth.getSession();if(data.session&&params.get('next'))location.replace(destination(data.session.user));}})();
</script></body></html>
