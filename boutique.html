<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Boutique — HaitiBoutik</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#191919;--line:#303030;--muted:#aaa;--accent:#ff8a35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f7f7;font:15px system-ui, sans-serif}header{padding:18px max(5vw,18px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:800;font-size:20px}.brand span{color:var(--accent)}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.hero{padding:28px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(120deg,#25201c,#171717)}.eyebrow{color:var(--accent);font-weight:700}.hero h1{font-size:clamp(28px,5vw,44px);margin:8px 0}.muted{color:var(--muted)}.tools{display:flex;gap:10px;margin:24px 0;flex-wrap:wrap}input{flex:1;min-width:180px;background:#1d1d1d;border:1px solid var(--line);padding:13px;border-radius:10px;color:white}button{background:var(--accent);color:#17110c;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.product{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.photo{height:145px;border-radius:12px;background:#292929;display:grid;place-items:center;font-size:42px}.price{font-weight:800;color:var(--accent);margin:8px 0}.cart{position:fixed;right:16px;bottom:16px;background:#242424;border:1px solid #555;border-radius:14px;padding:14px;max-width:300px;box-shadow:0 8px 30px #0008}.notice{font-size:12px;color:#ffc28e;margin-top:20px}
</style></head><body>
<header><a class="brand" href="index.html">Haiti<span>Boutik</span></a><span class="muted">La vitrine de votre boutique</span></header>
<main class="wrap"><section class="hero"><div class="eyebrow">BOUTIQUE DÉMO</div><h1>Découvrez nos produits</h1><p class="muted">Cette page illustre la future vitrine publique d'un marchand HaitiBoutik.</p></section>
<div class="tools"><input id="search" placeholder="Rechercher un produit…" aria-label="Rechercher un produit"><button id="showCart">Mon panier (<span id="count">0</span>)</button></div>
<section class="grid" id="products"></section><p class="notice">Démonstration uniquement : les produits sont des exemples, aucun paiement ni commande réelle n'est envoyé.</p></main>
<aside class="cart" id="cart" hidden><strong>Votre panier</strong><div id="items" class="muted">Votre panier est vide.</div><p id="total"></p><button id="checkout">Continuer (démo)</button></aside>
<script>
const catalog=[{name:"Écouteurs sans fil",price:1800,icon:"🎧"},{name:"Montre électronique",price:2500,icon:"⌚"},{name:"Chargeur rapide",price:950,icon:"🔌"},{name:"Coque de téléphone",price:450,icon:"📱"}];let cart=[];
const money=n=>new Intl.NumberFormat("fr-FR").format(n)+" GDS";
function render(){const q=document.querySelector("#search").value.toLowerCase();document.querySelector("#products").innerHTML=catalog.filter(p=>p.name.toLowerCase().includes(q)).map((p,i)=>'<article class="product"><div class="photo">'+p.icon+'</div><h3>'+p.name+'</h3><div class="price">'+money(p.price)+'</div><button data-add="'+catalog.indexOf(p)+'">Ajouter au panier</button></article>').join("")||'<p class="muted">Aucun produit trouvé.</p>';document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{cart.push(catalog[+b.dataset.add]);updateCart()})}
function updateCart(){document.querySelector("#count").textContent=cart.length;document.querySelector("#items").textContent=cart.length?cart.map(p=>p.name+" — "+money(p.price)).join(" · "):"Votre panier est vide.";document.querySelector("#total").textContent="Total indicatif : "+money(cart.reduce((s,p)=>s+p.price,0))}
document.querySelector("#search").addEventListener("input",render);document.querySelector("#showCart").onclick=()=>document.querySelector("#cart").hidden=!document.querySelector("#cart").hidden;document.querySelector("#checkout").onclick=()=>alert("Démo seulement : le système de commande et les paiements ne sont pas encore connectés.");render();updateCart();
</script></body></html>
